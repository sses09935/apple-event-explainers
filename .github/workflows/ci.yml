name: Local build and publication QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium runtime
        timeout-minutes: 5
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run check:public-tree
      - run: npm run verify:scaffold
      - run: npm run test:release-fixture
      - name: Enforce release gate when content declares readiness
        run: |
          if node --input-type=module -e "import fs from 'node:fs';process.exit(JSON.parse(fs.readFileSync('project.config.json')).publication_status==='release-ready'?0:1)"; then
            npm run verify:release
          fi
      - name: Record website version and exact build commit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const info=JSON.parse(fs.readFileSync('dist/web/build-info.json','utf8'));
          if(info.source_revision.commit!==process.env.GITHUB_SHA||info.source_revision.dirty!==false)throw Error('Website build must identify this clean CI checkout');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Website v${info.version}\n\nCommit: [${info.source_revision.commit}](${info.commit_url})\n\nBuilt at (UTC): ${info.built_at}\n`);
          NODE
      - name: Report current evidence and verification status
        run: npm run check:status
      # Only generated public files; no research, credentials, or QA media.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-local-web
          path: dist/web
          retention-days: 7
